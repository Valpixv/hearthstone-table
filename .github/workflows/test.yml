name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Recordings are generated from code; fail if a script change wasn't regenerated + committed.
      - run: npm run synth -- --all
      - run: git diff --exit-code -- recordings/
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    # Each 3D browser test runs alone on its runner; eight runners share the suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/8
        env:
          CI: 'true'
          # GitHub runners have no GPU: three.js renders in software, so the 3D tests get triple time there.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
